<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Feedback System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .header {
            background: #ffffff;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .header h2 {
            margin: 0;
            font-size: 22px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 15px auto;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 900px;
            border: none;
            display: block;
        }

        @media (max-width: 600px) {
            .header h2 {
                font-size: 18px;
            }

            .container {
                margin: 0;
                border-radius: 0;
            }

            iframe {
                height: 1000px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <iframe
            src="https://script.google.com/a/~/macros/s/AKfycbyv9LsML1iMedVd9zSdZKRVOH8VquMgOaz9lzmYkT00P3X1B4G6_iH5oYGVYjSX1BLo/exec"
            allow="payment">
        </iframe>
    </div>

</body>
</html>
